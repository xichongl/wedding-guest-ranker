<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Guest Ranker</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">💍 Guest Ranker</a>
            <div class="nav-links">
                <a href="/" class="nav-link" data-nav="home">Home</a>
                <a href="/guests" class="nav-link" data-nav="guests">Guests</a>
                <a href="/compare" class="nav-link" data-nav="compare">Compare</a>
                <a href="/results" class="nav-link" data-nav="results">Results</a>
                <a href="/history" class="nav-link" data-nav="history">History</a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
                <a href="/logout" class="nav-link" style="color: var(--color-danger);" title="Sign out">🚪</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Wedding Guest Ranker — make the hard decisions easier.</p>
    </footer>

    {% block scripts %}{% endblock %}
    <script>
        // Dark mode
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            const btn = document.getElementById('theme-toggle');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            btn.textContent = isDark ? '☀️' : '🌙';
            btn.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'dark' ? '' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next === 'dark' ? 'dark' : 'light');
                btn.textContent = next === 'dark' ? '☀️' : '🌙';
            });
        })();

        // Active nav highlighting
        const path = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            const nav = link.dataset.nav;
            if (nav === 'home' && path === '/') link.classList.add('active');
            else if (nav !== 'home' && path.startsWith('/' + nav)) link.classList.add('active');
        });
    </script>
</body>
</html>
